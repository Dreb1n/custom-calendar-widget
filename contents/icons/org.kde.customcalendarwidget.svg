<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e29"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Electric Cyan Digital Clock Display 12:00 -->
  <g filter="url(#glow)" fill="#00f0ff">
    <!-- Digit '1' -->
    <rect x="22" y="44" width="6" height="40" rx="3"/>

    <!-- Digit '2' -->
    <path d="M 38,44 h 16 v 18 h -16 v 22 h 16" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Colon ':' -->
    <circle cx="64" cy="54" r="3.5"/>
    <circle cx="64" cy="74" r="3.5"/>

    <!-- Digit '0' -->
    <rect x="72" y="44" width="16" height="40" rx="5" fill="none" stroke="#00f0ff" stroke-width="6"/>

    <!-- Digit '0' -->
    <rect x="94" y="44" width="16" height="40" rx="5" fill="none" stroke="#00f0ff" stroke-width="6"/>
  </g>
</svg>
